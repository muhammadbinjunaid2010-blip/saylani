<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad - Contact</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url(images/bg-contact.jpg) no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(16,25,40,0.92);
            backdrop-filter: blur(8px);
            padding: 1rem 2rem;
        }
        nav ul {
            list-style: none; margin: 0; padding: 0;
            display: flex; gap: 2rem; align-items: center;
        }
        nav a {
            text-decoration: none; color: #fff;
            font-weight: 500; font-size: 1rem;
        }
        .hero {
            flex: 1;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center;
            padding: 4rem 2rem;
        }
        .hero h1 { font-size: 2.8rem; margin-bottom: 1rem; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .hero p { font-size: 1.15rem; max-width: 600px; margin-bottom: 1.5rem; opacity: 0.9; }
        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            margin: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            border: none; cursor: pointer;
        }
        .btn-primary {
            background: #00e5ff;
            color: #0a1628;
        }
        .btn-outline {
            background: transparent;
            color: #fff;
            border: 2px solid #00e5ff;
        }
        .section {
            padding: 4rem 2rem;
            text-align: center;
            background: rgba(0,0,0,0.6);
            margin: 2rem;
            border-radius: 16px;
            backdrop-filter: blur(4px);
        }
        .section h2 { font-size: 2rem; margin-bottom: 2rem; color: #00e5ff; }
        .card-container {
            display: flex; justify-content: center;
            gap: 2rem; flex-wrap: wrap;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            padding: 1.5rem;
            width: 280px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card-img {
            width: 100%; height: 160px;
            object-fit: cover; border-radius: 8px;
            margin-bottom: 1rem;
        }
        .card h3 { color: #00e5ff; margin-bottom: 0.5rem; }
        .card p { opacity: 0.8; font-size: 0.9rem; }
        .card .btn { margin-top: 0.8rem; padding: 0.5rem 1.5rem; font-size: 0.85rem; }
        footer {
            background: rgba(16,25,40,0.95);
            backdrop-filter: blur(8px);
            text-align: center;
            padding: 2rem;
            margin-top: auto;
        }
        footer h3 { color: #00e5ff; margin-bottom: 0.5rem; }
        footer a { color: #fff; text-decoration: none; }
        footer .divider { margin: 0 1rem; opacity: 0.4; }
        .contact-form {
            padding: 2.5rem;
            max-width: 500px;
            margin: 2rem auto;
        }
        .contact-form label {
            display: block;
            text-align: left;
            margin-bottom: 0.4rem;
            font-weight: 500;
            color: #00e5ff;
        }
        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
        }
        .contact-form textarea {
            resize: vertical;
            min-height: 120px;
        }
        .contact-form .btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li style="margin-right:auto"><img src="images/logo.svg" alt="Logo" style="height:30px;vertical-align:middle;"></li>
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <div class="hero">
        <h1>Get In Touch</h1>
        <p>Have a question, a project idea, or just want to say hello? I'd love to hear from you!</p>
        <div>
            <a href="index.html" class="btn btn-outline">Back to Home</a>
            <a href="about.html" class="btn btn-outline">Learn More</a>
        </div>
    </div>
    <div class="section">
        <h2>Send a Message</h2>
        <div class="contact-form">
            <form>
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" placeholder="john@example.com" required>
                <label for="message">Your Message</label>
                <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </div>
    <footer>
        <h3>Let's Connect</h3>
        <p>
            <a href="mailto:your.email@example.com">Email Me</a>
            <span class="divider">|</span>
            <a href="https://instagram.com/muhammad.bin.junaid">Instagram</a>
        </p>
        <p style="margin-top:1rem;opacity:0.6;font-size:0.85rem;">&copy; 2026 Muhammad. Built with HTML.</p>
    </footer>
</body>
</html>
